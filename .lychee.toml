# Lychee link checker configuration

# Root-relative paths (/blog, /portfolio, etc.) are Docusaurus client-side routes.
# Setting base to localhost causes them to resolve to http://localhost/..., which
# is then caught by the localhost exclude below.
base_url = "http://localhost"

exclude = [
  "^http://localhost",
  "^https?://.*\\.example\\.com",
  "^mailto:",
]

# Treat these status codes as valid (some sites return 403/429/999 to bots)
accept = [200, 403, 429, 999]

timeout = 20
max_retries = 3
