# Lychee link checker configuration

# Skip URLs that are known to be unreachable in CI (localhost, examples, etc.)
# Root-relative paths (/blog, /portfolio, etc.) are Docusaurus client-side routes —
# they do not exist as standalone HTTP endpoints and cannot be checked by Lychee.
exclude = [
  "^http://localhost",
  "^https?://.*\\.example\\.com",
  "^mailto:",
  "^/",
]

# Treat these status codes as valid (some sites return 403/429 to bots)
accept = [200, 403, 429]

timeout = 20
max_retries = 3
