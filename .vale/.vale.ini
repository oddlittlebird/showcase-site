StylesPath = styles
MinAlertLevel = suggestion
Vocab = Base

Packages = Google

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Diana
Vale.Spelling = warning
Google.Acronyms = NO
Google.Headings = NO
# Spaced em dashes are intentional house style.
Google.EmDash = NO

# Scoped to prose files: the bare [**/blog/**] glob also linted tags.yml.
[**/blog/**/*.{md,mdx}]
BasedOnStyles = Vale, Google, Diana
Vale.Spelling = warning
Google.Acronyms = NO
Google.Headings = NO
Google.EmDash = NO
# Misfire on filenames and identifiers rather than prose:
# '.mdx', 'lychee', '4h', 'w.A'.
Vale.Terms = NO
Google.Units = NO
Google.Spacing = NO
# The blog is first-person and informal by design. Docs and pages keep both.
Google.FirstPerson = NO
Google.We = NO
Google.Exclamation = NO
