openapi: 3.1.0

info:
  title: Garden Companion API
  version: 1.0.0
  description: |
    The Garden Companion API provides plant information and companion planting
    recommendations to help gardeners plan healthy, productive gardens.

    Companion planting is the practice of growing different plants near each other
    for mutual benefit — improving growth, deterring pests, and making the most
    of garden space.

    ## Base URL

    ```
    https://api.gardencompanion.example.com/v1
    ```

servers:
  - url: https://api.gardencompanion.example.com/v1
    description: Production

tags:
  - name: Plants
    description: Search and retrieve plant information.
  - name: Companions
    description: Get companion planting recommendations for a specific plant.

paths:
  /plants:
    get:
      operationId: listPlants
      summary: Get all plants
      description: Returns a list of all plants in the database.
      tags:
        - Plants
      responses:
        '200':
          description: A list of plants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
              example:
                - id: asparagus-001
                  common_name: Asparagus
                - id: beans-001
                  common_name: Beans
                - id: beets-001
                  common_name: Beets
                - id: cabbage-001
                  common_name: Cabbage
                - id: carrots-001
                  common_name: Carrots
                - id: corn-001
                  common_name: Corn
                - id: cucumbers-001
                  common_name: Cucumbers
                - id: dill-001
                  common_name: Dill
                - id: fennel-001
                  common_name: Fennel
                - id: garlic-001
                  common_name: Garlic
                - id: lettuce-001
                  common_name: Lettuce
                - id: onions-001
                  common_name: Onions
                - id: peas-001
                  common_name: Peas
                - id: peppers-001
                  common_name: Peppers
                - id: potatoes-001
                  common_name: Potatoes
                - id: pumpkins-001
                  common_name: Pumpkins and winter squash
                - id: radishes-001
                  common_name: Radishes
                - id: spinach-001
                  common_name: Spinach
                - id: tomatoes-001
                  common_name: Tomatoes
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /plants/{plantId}:
    get:
      operationId: getPlant
      summary: Get a plant
      description: Returns information about a single plant.
      tags:
        - Plants
      parameters:
        - name: plantId
          in: path
          required: true
          description: The unique identifier for the plant.
          schema:
            type: string
            example: tomatoes-001
      responses:
        '200':
          description: Plant information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
              example:
                id: tomatoes-001
                common_name: Tomatoes
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /plants/{plantId}/companions:
    get:
      operationId: getCompanions
      summary: Get companion plants
      description: |
        Returns companion planting recommendations for the specified plant.

        Each result includes a `relationship` field indicating whether the
        pairing is **beneficial** or **harmful**, and a `reason` explaining
        the interaction where available.
      tags:
        - Companions
      parameters:
        - name: plantId
          in: path
          required: true
          description: The unique identifier for the plant to get companions for.
          schema:
            type: string
            example: tomatoes-001
      responses:
        '200':
          description: A list of companion planting recommendations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plant_id:
                    type: string
                    description: The plant you requested companions for.
                    example: tomatoes-001
                  companions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Companion'
              example:
                plant_id: tomatoes-001
                companions:
                  - plant:
                      id: asparagus-001
                      common_name: Asparagus
                    relationship: beneficial
                  - plant:
                      id: basil-001
                      common_name: Basil
                    relationship: beneficial
                    reason: Enhances growth and pest resistance.
                  - plant:
                      id: beans-001
                      common_name: Beans
                    relationship: beneficial
                  - plant:
                      id: borage-001
                      common_name: Borage
                    relationship: beneficial
                    reason: Attracts beneficial insects and pollinators.
                  - plant:
                      id: celery-001
                      common_name: Celery
                    relationship: beneficial
                  - plant:
                      id: marigold-001
                      common_name: Marigold
                    relationship: beneficial
                    reason: Reduce whitefly populations.
                  - plant:
                      id: parsley-001
                      common_name: Parsley
                    relationship: beneficial
                    reason: Attracts beneficial insects.
                  - plant:
                      id: radishes-001
                      common_name: Radishes
                    relationship: beneficial
                  - plant:
                      id: rosemary-001
                      common_name: Rosemary
                    relationship: beneficial
                  - plant:
                      id: thyme-001
                      common_name: Thyme
                    relationship: beneficial
                  - plant:
                      id: broccoli-001
                      common_name: Broccoli
                    relationship: harmful
                    reason: Can stunt the growth of nightshades.
                  - plant:
                      id: cabbage-001
                      common_name: Cabbage
                    relationship: harmful
                    reason: Can stunt the growth of nightshades.
                  - plant:
                      id: cauliflower-001
                      common_name: Cauliflower
                    relationship: harmful
                  - plant:
                      id: corn-001
                      common_name: Corn
                    relationship: harmful
                    reason: >-
                      Tomatoes and corn are both heavy feeders and can deplete
                      the soil of nutrients.
                  - plant:
                      id: dill-001
                      common_name: Dill
                    relationship: harmful
                  - plant:
                      id: eggplant-001
                      common_name: Eggplant
                    relationship: harmful
                  - plant:
                      id: fennel-001
                      common_name: Fennel
                    relationship: harmful
                  - plant:
                      id: peppers-001
                      common_name: Peppers
                    relationship: harmful
                  - plant:
                      id: potatoes-001
                      common_name: Potatoes
                    relationship: harmful
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  schemas:
    Plant:
      type: object
      description: A plant in the database.
      properties:
        id:
          type: string
          description: Unique identifier for the plant.
          example: tomatoes-001
        common_name:
          type: string
          description: The plant's common name.
          example: Tomatoes

    Companion:
      type: object
      description: A companion planting recommendation.
      properties:
        plant:
          $ref: '#/components/schemas/Plant'
        relationship:
          type: string
          enum: [beneficial, harmful]
          description: |
            The relationship between the two plants.

            - `beneficial` — These plants benefit each other in some manner. Plant them near each other when possible.
            - `harmful` — These plants damage the well-being of one plant or the other. Do not plant them near each other.
          example: beneficial
        reason:
          type: string
          description: An explanation of why this pairing works or doesn't.
          example: Enhances growth and pest resistance.

    Error:
      type: object
      description: A standard error response.
      properties:
        code:
          type: integer
          description: The HTTP status code.
          example: 404
        message:
          type: string
          description: A human-readable description of the error.
          example: Plant not found.

  responses:
    NotFound:
      description: The requested plant does not exist in the database.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Plant not found. That plant isn't part of the database.

    TooManyRequests:
      description: The request limit has been exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 429
            message: Request limit exceeded. Try again in 60 seconds.
