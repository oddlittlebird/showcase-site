name: Coupling check

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run coupling check
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          python3 scripts/check-coupling.py $FILES | tee coupling-output.txt

      - name: Comment on PR if a coupled file wasn't updated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "Possible documentation drift" coupling-output.txt; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file coupling-output.txt
          fi
