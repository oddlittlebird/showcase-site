name: API reference screenshot test

on:
  push:
    branches:
      - main
    paths:
      - 'website/src/pages/doc-detective/api-reference-test.mdx'
      - 'website/static/api/garden.yaml'
      - 'website/docusaurus.config.ts'
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  doc-detective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Serve website
        working-directory: website
        run: npx docusaurus serve --no-open &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/showcase-site/api

      - name: Install Doc Detective
        run: npm install -g doc-detective@4.38.1

      - name: Run tests
        run: doc-detective --config doc-detective/config.json --input website/src/pages/doc-detective/api-reference-test.mdx || true

      - name: Parse test results
        id: parse_results
        if: always()
        run: |
          # doc-detective's CLI exits 0 regardless of pass/fail, so read the
          # actual result from its own JSON report instead of the exit code.
          RESULTS=$(ls -t testResults-*.json 2>/dev/null | head -1)
          if [ -z "$RESULTS" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "variation=0" >> "$GITHUB_OUTPUT"
            echo "maxVariation=0.02" >> "$GITHUB_OUTPUT"
            echo "exceeded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FAIL_COUNT=$(jq '.summary.tests.fail' "$RESULTS")
          FAILED="false"
          if [ "$FAIL_COUNT" != "0" ]; then FAILED="true"; fi
          VARIATION=$(jq '([.specs[].tests[].contexts[].steps[] | select(.outputs.variation != null)][0].outputs.variation) // 0' "$RESULTS")
          MAXVAR=$(jq '([.specs[].tests[].contexts[].steps[] | select(.outputs.variation != null)][0].screenshot.maxVariation) // 0.02' "$RESULTS")
          EXCEEDED=$(jq -n --argjson v "$VARIATION" --argjson m "$MAXVAR" '$v > $m')
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "variation=$VARIATION" >> "$GITHUB_OUTPUT"
          echo "maxVariation=$MAXVAR" >> "$GITHUB_OUTPUT"
          echo "exceeded=$EXCEEDED" >> "$GITHUB_OUTPUT"

      - name: Record API reference test status
        if: always()
        run: |
          mkdir -p website/static/doc-detective
          status="pass"
          if [ "${{ steps.parse_results.outputs.failed }}" = "true" ]; then status="fail"; fi
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"status": "%s", "timestamp": "%s"}\n' "$status" "$timestamp" > website/static/doc-detective/api-reference-status.json
          printf '{"variation": %s, "maxVariation": %s, "exceeded": %s, "timestamp": "%s"}\n' "${{ steps.parse_results.outputs.variation }}" "${{ steps.parse_results.outputs.maxVariation }}" "${{ steps.parse_results.outputs.exceeded }}" "$timestamp" > website/static/doc-detective/api-reference-variation.json

      - name: Commit updated screenshot and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/doc-detective/api-reference.png website/static/doc-detective/api-reference-baseline.png website/static/doc-detective/api-reference-status.json website/static/doc-detective/api-reference-variation.json
          git diff --staged --quiet || git commit -m "chore: update API reference screenshot"
          git pull --rebase origin main
          git push

      - name: Notify on visual drift
        if: steps.parse_results.outputs.exceeded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="API reference screenshot exceeded maxVariation threshold"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          BODY="API reference screenshot comparison exceeded its maxVariation threshold. Variation: ${{ steps.parse_results.outputs.variation }} (threshold: ${{ steps.parse_results.outputs.maxVariation }}). See the [API reference test page](https://oddlittlebird.github.io/showcase-site/doc-detective/api-reference-test) for the current screenshot. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Fail if tests failed
        if: steps.parse_results.outputs.failed == 'true'
        run: exit 1
