name: API reference screenshot test

on:
  push:
    branches:
      - main
    paths:
      - 'website/src/pages/doc-detective/api-reference-test.mdx'
      - 'website/static/api/garden.yaml'
      - 'website/docusaurus.config.ts'
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doc-detective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Serve website
        working-directory: website
        run: npx docusaurus serve --no-open &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/showcase-site/api

      - name: Install Doc Detective
        run: npm install -g doc-detective@4.29.1

      - name: Run tests
        id: run_tests
        run: doc-detective --config doc-detective/config.json --input website/src/pages/doc-detective/api-reference-test.mdx || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Record API reference test status
        if: always()
        run: |
          mkdir -p website/static/doc-detective
          status="pass"
          if [ "${{ steps.run_tests.outputs.failed }}" = "true" ]; then status="fail"; fi
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"status": "%s", "timestamp": "%s"}\n' "$status" "$timestamp" > website/static/doc-detective/api-reference-status.json

      - name: Commit updated screenshot and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/doc-detective/api-reference.png website/static/doc-detective/api-reference-status.json
          git diff --staged --quiet || git commit -m "chore: update API reference screenshot"
          git pull --rebase origin main
          git push

      - name: Fail if tests failed
        if: steps.run_tests.outputs.failed == 'true'
        run: exit 1
