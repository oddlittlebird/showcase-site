name: Deploy

on:
  push:
    branches:
      - main
  # Scheduled checks commit status files with GITHUB_TOKEN, which doesn't
  # trigger push workflows. Rather than deploying after each one, deploy once
  # after CLI flag check, the last check in the daily schedule, to publish
  # everything the checks committed that day. Generate llms.txt dispatches
  # this workflow itself when it commits, because the llms.txt verification
  # test needs the new file live right away.
  workflow_run:
    workflows:
      - CLI flag check
    types:
      - completed
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A push-triggered CLI flag check already has a push deploy of its own.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
