name: Pipeline page test

on:
  push:
    branches:
      - main
    paths:
      - 'website/docs/**'
      - 'doc-detective/tests/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doc-detective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Serve website
        working-directory: website
        run: npx docusaurus serve --no-open &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/showcase-site/docs/pipeline

      - name: Install Doc Detective
        run: npm install -g doc-detective@4.38.1

      - name: Run tests
        run: doc-detective --config doc-detective/config.json --input doc-detective/tests || true

      - name: Parse test results
        id: parse_results
        if: always()
        run: |
          # doc-detective's CLI exits 0 regardless of pass/fail, so read the
          # actual result from its own JSON report instead of the exit code.
          RESULTS=$(ls -t testResults-*.json 2>/dev/null | head -1)
          if [ -z "$RESULTS" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FAIL_COUNT=$(jq '.summary.tests.fail' "$RESULTS")
          FAILED="false"
          if [ "$FAIL_COUNT" != "0" ]; then FAILED="true"; fi
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Record pipeline test status
        if: always()
        run: |
          mkdir -p website/static/doc-detective
          status="pass"
          if [ "${{ steps.parse_results.outputs.failed }}" = "true" ]; then status="fail"; fi
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"status": "%s", "timestamp": "%s"}\n' "$status" "$timestamp" > website/static/doc-detective/pipeline-status.json

      - name: Commit updated status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/doc-detective/pipeline-status.json
          git diff --staged --quiet || git commit -m "chore: update pipeline test status"
          git pull --rebase origin main
          git push

      - name: Fail if tests failed
        if: steps.parse_results.outputs.failed == 'true'
        run: exit 1
