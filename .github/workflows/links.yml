name: Check links

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 1'  # every Monday at 8am UTC

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            'website/docs/**/*.md'
            'website/docs/**/*.mdx'
            'website/blog/**/*.md'
            'website/blog/**/*.mdx'
            'website/src/pages/**/*.mdx'
            'website/static/llms.txt'
            'README.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
