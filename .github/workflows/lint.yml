name: Lint

on:
  pull_request:
    paths:
      - 'website/docs/**'
      - 'website/blog/**'
      - 'website/src/pages/**/*.mdx'
      - 'website/static/llms.txt'
      # Re-run the checks when the rules themselves change, not just the content.
      - 'docmeta.config.yaml'
      - 'docmeta/**'
      - '.github/workflows/lint.yml'
  # Direct pushes to main happen here, from automated commits and from
  # branches merged without a PR. Without this trigger those never get linted.
  push:
    branches:
      - main
    paths:
      - 'website/docs/**'
      - 'website/blog/**'
      - 'website/src/pages/**/*.mdx'
      - 'website/static/llms.txt'
      # Re-run the checks when the rules themselves change, not just the content.
      - 'docmeta.config.yaml'
      - 'docmeta/**'
      - '.github/workflows/lint.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MDX parser
        run: npm install -g mdx2vast

      - name: Download Vale packages
        uses: errata-ai/vale-action@reviewdog
        with:
          files: '["website/docs", "website/blog", "website/src/pages"]'
          vale_flags: '--config=.vale/.vale.ini'
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docmeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docmeta requires Node 24. On anything older, npm reports the engine
      # mismatch as a warning, installs anyway, and the step looks like it ran.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install docmeta
        run: npm install -g docmeta

      - name: Validate front matter
        run: docmeta validate -f github
