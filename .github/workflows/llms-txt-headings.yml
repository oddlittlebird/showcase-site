name: Count llms.txt headings

on:
  push:
    branches:
      - main
    paths:
      - 'website/static/llms.txt'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count headings
        run: python3 scripts/count-llms-headings.py

      - name: Commit heading counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/doc-detective/llms-txt-headings.json
          git diff --staged --quiet || git commit -m "chore: update llms.txt heading counts"
          git pull --rebase origin main
          git push
