name: Generate llms.txt

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/llms-txt.template'
      - 'scripts/pipeline-facts.json'
      - 'scripts/generate-llms-txt.py'
      - '.github/workflows/**'
      - '.vale/styles/Diana/**'
      - 'website/docusaurus.config.ts'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate llms.txt
        run: python3 scripts/generate-llms-txt.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/llms.txt
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: regenerate llms.txt from live repo facts"
          git pull --rebase origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Deploy only runs once a day for scheduled checks, but the llms.txt
      # verification test compares the live file against the repo, so a new
      # llms.txt has to go live now. A GITHUB_TOKEN push doesn't trigger
      # Deploy on its own; workflow_dispatch is the exception that does.
      - name: Deploy the new llms.txt
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
