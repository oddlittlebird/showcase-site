name: Responsive screenshot test

on:
  push:
    branches:
      - main
    paths:
      - 'website/src/pages/doc-detective/responsive-test.mdx'
      - 'website/docusaurus.config.ts'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doc-detective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Serve website
        working-directory: website
        run: npx docusaurus serve --no-open &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/showcase-site/

      - name: Install Doc Detective
        run: |
          npm install -g doc-detective@4.38.1
          # Doc Detective lazy-installs its browser driver stack into a temp
          # cache using caret ranges, so pinning doc-detective doesn't pin the
          # driver. appium-chromium-driver 3.1.0 rejects every CSS selector
          # lookup ("Locator Strategy 'css selector' is not supported for this
          # session"). Pre-install the runtime deps these tests use, with the
          # driver held at 3.0.13, so Doc Detective finds them already
          # satisfied and doesn't re-resolve the tree. Ranges match
          # doc-detective@4.38.1's ddRuntimeDependencies.
          RUNTIME_DIR="$(node -p "require('os').tmpdir()")/doc-detective/runtime"
          mkdir -p "$RUNTIME_DIR"
          npm install --prefix "$RUNTIME_DIR" --no-audit --no-fund \
            appium-chromium-driver@3.0.13 \
            appium@^3.6.0 \
            webdriverio@^9.30.1 \
            @puppeteer/browsers@^3.1.0 \
            proxy-agent@^8.0.2 \
            sharp@^0.35.3 \
            pixelmatch@^7.2.0 \
            pngjs@^7.0.0

      - name: Run tests
        run: doc-detective --config doc-detective/config.json --input website/src/pages/doc-detective/responsive-test.mdx || true

      - name: Parse test results
        id: parse_results
        if: always()
        run: |
          # doc-detective's CLI exits 0 regardless of pass/fail, so read the
          # actual result from its own JSON report instead of the exit code.
          RESULTS=$(ls -t testResults-*.json 2>/dev/null | head -1)
          if [ -z "$RESULTS" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FAIL_COUNT=$(jq '.summary.tests.fail' "$RESULTS")
          FAILED="false"
          if [ "$FAIL_COUNT" != "0" ]; then FAILED="true"; fi
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Record responsive test status
        if: always()
        run: |
          mkdir -p website/static/doc-detective
          status="pass"
          if [ "${{ steps.parse_results.outputs.failed }}" = "true" ]; then status="fail"; fi
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"status": "%s", "timestamp": "%s"}\n' "$status" "$timestamp" > website/static/doc-detective/responsive-status.json

      - name: Commit updated screenshots and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/doc-detective/homepage-mobile.png website/static/doc-detective/homepage-desktop.png website/static/doc-detective/responsive-status.json
          git diff --staged --quiet || git commit -m "chore: update responsive screenshots"
          git pull --rebase origin main
          git push

      - name: Fail if tests failed
        if: steps.parse_results.outputs.failed == 'true'
        run: exit 1
